<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 离线语音输入 & 对话</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#20242e; --border:#2b303b;
    --fg:#e6e8ec; --muted:#8b93a3; --accent:#4f8cff; --accent2:#3a6fd8;
    --green:#37c871; --red:#ff5f6d; --chip:#2a3140;
  }
  body{ font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); height:100vh; overflow:hidden; }
  .app{ display:flex; height:100vh; }
  /* 侧栏 */
  .sidebar{ width:220px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .logo{ padding:18px 16px; font-size:16px; font-weight:600; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .logo-img{ width:26px; height:26px; border-radius:6px; object-fit:contain; }
  .logo .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .nav{ padding:10px; }
  .nav button{ width:100%; text-align:left; padding:11px 14px; margin-bottom:4px; background:transparent; border:none; color:var(--muted); border-radius:8px; cursor:pointer; font-size:14px; transition:.15s; }
  .nav button:hover{ background:var(--panel2); color:var(--fg); }
  .nav button.active{ background:var(--accent); color:#fff; }
  .sidebar .foot{ margin-top:auto; padding:12px 14px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }
  .status-title{ font-size:11px; color:var(--muted); margin-bottom:8px; opacity:.7; }
  .status-row{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--fg); margin-bottom:6px; }
  .status-row .status-txt{ margin-left:auto; font-size:11px; color:var(--muted); }
  .status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--muted); }
  .status-dot.loading{ background:#e0a800; animation:blink 1s infinite; }
  .status-dot.ready{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .status-dot.error{ background:var(--red); }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  /* 主区 */
  .main{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar{ padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; background:var(--panel); }
  .topbar h2{ font-size:17px; font-weight:600; }
  .topbar .spacer{ flex:1; }
  select,input,textarea{ background:var(--panel2); border:1px solid var(--border); color:var(--fg); border-radius:8px; padding:8px 11px; font-size:13px; outline:none; }
  select:focus,input:focus,textarea:focus{ border-color:var(--accent); }
  .page{ flex:1; overflow-y:auto; padding:22px; display:none; }
  .page.active{ display:block; }
  /* 录音区 */
  .rec-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:34px; text-align:center; max-width:720px; margin:0 auto 22px; }
  .rec-btn{ width:110px; height:110px; border-radius:50%; border:none; cursor:pointer; font-size:15px; font-weight:600; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 24px rgba(79,140,255,.35); transition:.2s; }
  .rec-btn:hover{ transform:scale(1.05); }
  .rec-btn.recording{ background:linear-gradient(135deg,#ff5f6d,#d63d4a); box-shadow:0 6px 30px rgba(255,95,109,.5); animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.07);} }
  .rec-hint{ margin-top:16px; color:var(--muted); font-size:13px; }
  .rec-timer{ font-size:26px; font-weight:600; margin-top:12px; font-variant-numeric:tabular-nums; }
  .wave{ height:40px; display:flex; align-items:center; justify-content:center; gap:3px; margin-top:14px; }
  .wave span{ width:4px; background:var(--accent); border-radius:2px; height:6px; transition:height .1s; }
  .upload-zone{ margin-top:20px; border:2px dashed var(--border); border-radius:12px; padding:22px; color:var(--muted); font-size:13px; cursor:pointer; }
  .upload-zone:hover{ border-color:var(--accent); color:var(--fg); }
  .row{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  /* 记录列表 */
  .rec-list{ max-width:900px; margin:0 auto; }
  .rec-item{ background:var(--panel); border:1px solid var(--border); border-radius:11px; padding:15px 18px; margin-bottom:11px; display:flex; gap:14px; align-items:flex-start; }
  .rec-item .content{ flex:1; }
  .rec-item .text{ font-size:15px; line-height:1.6; margin-bottom:7px; }
  .rec-item .meta{ font-size:12px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .chip{ background:var(--chip); padding:2px 9px; border-radius:20px; font-size:11px; }
  .chip.lang{ color:#7fb3ff; } .chip.emo{ color:#ffcf7f; }
  .icon-btn{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:5px; border-radius:6px; }
  .icon-btn:hover{ background:var(--panel2); color:var(--red); }
  .empty{ text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; }
  /* 对话 */
  .chat-wrap{ display:flex; height:100%; }
  .conv-list{ width:220px; border-right:1px solid var(--border); overflow-y:auto; background:var(--panel); }
  .conv-list .new-btn{ margin:12px; width:calc(100% - 24px); padding:10px; background:var(--accent); border:none; color:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  .conv-item{ padding:11px 15px; cursor:pointer; font-size:13px; color:var(--muted); border-left:3px solid transparent; display:flex; align-items:center; gap:6px; }
  .conv-item:hover{ background:var(--panel2); }
  .conv-item.active{ background:var(--panel2); color:var(--fg); border-left-color:var(--accent); }
  .conv-item .t{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chat-main{ flex:1; display:flex; flex-direction:column; }
  .msgs{ flex:1; overflow-y:auto; padding:22px; }
  .msg{ max-width:78%; margin-bottom:16px; padding:12px 16px; border-radius:12px; line-height:1.65; font-size:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.user{ background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:3px; }
  .msg.assistant{ background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:3px; }
  .msg .think{ font-size:12px; color:var(--muted); font-style:italic; border-left:2px solid var(--border); padding-left:8px; margin-bottom:8px; display:none; }
  .msg .think.show{ display:block; }
  .think-toggle{ font-size:11px; color:var(--accent); cursor:pointer; margin-bottom:6px; }
  .speak-btn{ background:transparent; border:none; cursor:pointer; font-size:13px; opacity:.5; margin-top:6px; padding:2px 4px; border-radius:5px; transition:.15s; }
  .speak-btn:hover{ opacity:1; background:var(--panel2); }
  .input-bar{ padding:16px 22px; border-top:1px solid var(--border); background:var(--panel); }
  .input-bar .box{ display:flex; gap:10px; align-items:flex-end; }
  .input-bar textarea{ flex:1; resize:none; max-height:140px; min-height:44px; line-height:1.5; }
  .send-btn,.mic-btn{ padding:11px 16px; border:none; border-radius:8px; cursor:pointer; font-size:14px; color:#fff; }
  .send-btn{ background:var(--accent); }
  .mic-btn{ background:var(--panel2); border:1px solid var(--border); color:var(--fg); }
  .mic-btn.recording{ background:var(--red); color:#fff; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--border); padding:11px 20px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:99; }
  .toast.show{ opacity:1; }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  /* 模型管理 */
  .models-wrap{ max-width:820px; margin:0 auto; }
  .models-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .add-provider-btn{ padding:9px 16px; background:var(--accent); border:none; color:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  .provider-card{ background:var(--panel); border:1px solid var(--border); border-radius:11px; padding:15px 18px; margin-bottom:11px; display:flex; align-items:center; gap:14px; }
  .provider-card.is-default{ border-color:var(--accent); }
  .provider-info{ flex:1; }
  .provider-info .pn{ font-size:15px; font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .provider-info .pmeta{ font-size:12px; color:var(--muted); word-break:break-all; }
  .badge{ font-size:10px; padding:2px 8px; border-radius:20px; background:var(--chip); color:var(--muted); }
  .badge.default{ background:var(--accent); color:#fff; }
  .badge.kind{ background:#2a3140; color:#7fb3ff; }
  .provider-acts{ display:flex; gap:6px; flex-shrink:0; }
  .mini-btn{ padding:7px 12px; background:var(--panel2); border:1px solid var(--border); color:var(--fg); border-radius:7px; cursor:pointer; font-size:12px; }
  .mini-btn:hover{ border-color:var(--accent); }
  .mini-btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini-btn.danger:hover{ border-color:var(--red); color:var(--red); }
  .modal-mask{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; align-items:center; justify-content:center; }
  .modal-mask.show{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; width:440px; max-width:92vw; }
  .modal-title{ font-size:16px; font-weight:600; margin-bottom:18px; }
  .fld{ display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:13px; }
  .fld>span{ width:72px; color:var(--muted); flex-shrink:0; }
  .fld input,.fld select{ flex:1; }
  .modal-actions{ display:flex; align-items:center; gap:8px; margin-top:18px; }
  .modal-actions .spacer{ flex:1; }
  .pm-msg{ margin-top:12px; font-size:12px; min-height:16px; }
  .pm-msg.ok{ color:var(--green); } .pm-msg.err{ color:var(--red); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><img src="/logo.png" alt="logo" class="logo-img"> AI 语音助手</div>
    <nav class="nav">
      <button data-page="record" class="active">🎙️ 语音识别</button>
      <button data-page="history">📝 识别记录</button>
      <button data-page="chat">💬 AI 对话</button>
      <button data-page="models">⚙️ 模型管理</button>
    </nav>
    <div class="foot">
      <div class="status-title">模型状态</div>
      <div class="status-row"><span class="status-dot" id="dot-asr"></span><span>语音识别</span><span class="status-txt" id="txt-asr">加载中…</span></div>
      <div class="status-row"><span class="status-dot" id="dot-llm"></span><span>对话模型</span><span class="status-txt" id="txt-llm">加载中…</span></div>
      <div class="status-row"><span class="status-dot" id="dot-tts"></span><span>语音合成</span><span class="status-txt" id="txt-tts">加载中…</span></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">语音识别</h2>
      <div class="spacer"></div>
      <label style="font-size:12px;color:var(--muted)">语种</label>
      <select id="langSel">
        <option value="auto">自动</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
        <option value="yue">粤语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
      </select>
      <select id="modelSel" style="display:none"></select>
      <select id="voiceSel" style="display:none" title="发音人"></select>
      <label id="autoPlayLabel" style="display:none;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;align-items:center;gap:5px">
        <input type="checkbox" id="autoPlayChk" checked style="cursor:pointer"> 自动朗读
      </label>
    </div>

    <!-- 语音识别页 -->
    <div class="page active" id="page-record">
      <div class="rec-card">
        <button class="rec-btn" id="recBtn">开始录音</button>
        <div class="rec-timer" id="recTimer">00:00</div>
        <div class="wave" id="wave"></div>
        <div class="rec-hint" id="recHint">点击开始录音，再次点击结束并识别</div>
        <div class="upload-zone" id="uploadZone">
          📁 或点击此处上传音频文件 (wav/mp3/m4a/flac...)
          <input type="file" id="fileInput" accept="audio/*" style="display:none">
        </div>
      </div>
      <div class="rec-list" id="latestResult"></div>
    </div>

    <!-- 识别记录页 -->
    <div class="page" id="page-history">
      <div class="rec-list">
        <div class="row" style="justify-content:space-between;margin-bottom:16px">
          <span style="color:var(--muted);font-size:13px" id="histCount"></span>
          <div class="row">
            <button class="icon-btn" id="exportBtn" style="font-size:13px;color:var(--accent)">⬇ 导出</button>
            <button class="icon-btn" id="clearBtn" style="font-size:13px">🗑 清空</button>
          </div>
        </div>
        <div id="histList"></div>
      </div>
    </div>

    <!-- 对话页 -->
    <div class="page" id="page-chat" style="padding:0">
      <div class="chat-wrap">
        <div class="conv-list">
          <button class="new-btn" id="newConvBtn">＋ 新对话</button>
          <div id="convItems"></div>
        </div>
        <div class="chat-main">
          <div class="msgs" id="msgs">
            <div class="empty">开始一段新对话吧 👋<br><span style="font-size:12px">支持语音输入，点击输入框旁的麦克风</span></div>
          </div>
          <div class="input-bar">
            <div class="box">
              <button class="mic-btn" id="chatMic" title="语音输入">🎙️</button>
              <textarea id="chatInput" placeholder="输入消息，或点击麦克风语音输入... (Enter 发送, Shift+Enter 换行)"></textarea>
              <button class="send-btn" id="sendBtn">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 模型管理页 -->
    <div class="page" id="page-models">
      <div class="models-wrap">
        <div class="models-head">
          <span style="color:var(--muted);font-size:13px">配置对话使用的大语言模型，本地 Ollama 与在线 API 均可</span>
          <button class="add-provider-btn" id="addProviderBtn">＋ 添加模型</button>
        </div>
        <div id="providerList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 添加/编辑模型 弹窗 -->
<div class="modal-mask" id="providerModal">
  <div class="modal">
    <div class="modal-title" id="pmTitle">添加模型</div>
    <label class="fld"><span>类型</span>
      <select id="pmKind">
        <option value="ollama">Ollama (本地)</option>
        <option value="openai">OpenAI 兼容 (在线)</option>
      </select>
    </label>
    <label class="fld"><span>名称</span><input id="pmName" placeholder="如：DeepSeek 官方"></label>
    <label class="fld"><span>接口地址</span><input id="pmUrl" placeholder="https://api.deepseek.com/v1"></label>
    <label class="fld" id="pmKeyFld"><span>API Key</span><input id="pmKey" type="password" placeholder="sk-..."></label>
    <label class="fld"><span>模型</span>
      <div style="display:flex;gap:6px;flex:1">
        <input id="pmModel" placeholder="模型名，或点右侧拉取" style="flex:1">
        <button class="mini-btn" id="pmFetchModels">拉取</button>
      </div>
    </label>
    <select id="pmModelList" style="display:none;width:100%;margin-top:-6px"></select>
    <div class="modal-actions">
      <button class="mini-btn" id="pmTest">测试连接</button>
      <span class="spacer"></span>
      <button class="mini-btn" id="pmCancel">取消</button>
      <button class="mini-btn primary" id="pmSave">保存</button>
    </div>
    <div class="pm-msg" id="pmMsg"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const API = "";
let currentConv = null;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function fmtTime(ts){ const d=new Date(ts*1000); return d.toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }

// ---------- 导航 ----------
const titles={record:"语音识别",history:"识别记录",chat:"AI 对话",models:"模型管理"};
$$(".nav button").forEach(b=>b.onclick=()=>{
  $$(".nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  const p=b.dataset.page;
  $$(".page").forEach(x=>x.classList.remove("active"));
  $("#page-"+p).classList.add("active");
  $("#pageTitle").textContent=titles[p];
  $("#modelSel").style.display = p==="chat"?"block":"none";
  const chatCtl = p==="chat"?"inline-flex":"none";
  $("#voiceSel").style.display = p==="chat"?"block":"none";
  $("#autoPlayLabel").style.display = chatCtl;
  if(p==="history") loadHistory();
  if(p==="chat"){ loadConversations(); loadModels(); loadVoices(); }
  if(p==="models") loadProviders();
});

// ========== 录音核心 (Web Audio API -> PCM16) ==========
class Recorder{
  constructor(){ this.recording=false; this.chunks=[]; this.ctx=null; this.stream=null; }
  async start(onLevel){
    this.stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
    this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.sampleRate=this.ctx.sampleRate;
    const src=this.ctx.createMediaStreamSource(this.stream);
    this.proc=this.ctx.createScriptProcessor(4096,1,1);
    this.chunks=[];
    this.proc.onaudioprocess=e=>{
      const d=e.inputBuffer.getChannelData(0);
      this.chunks.push(new Float32Array(d));
      if(onLevel){ let s=0; for(let i=0;i<d.length;i++)s+=d[i]*d[i]; onLevel(Math.sqrt(s/d.length)); }
    };
    src.connect(this.proc); this.proc.connect(this.ctx.destination);
    this.recording=true;
  }
  stop(){
    this.recording=false;
    if(this.proc)this.proc.disconnect();
    if(this.stream)this.stream.getTracks().forEach(t=>t.stop());
    if(this.ctx)this.ctx.close();
    // 合并为 PCM16
    let len=this.chunks.reduce((a,c)=>a+c.length,0);
    let f32=new Float32Array(len),off=0;
    for(const c of this.chunks){ f32.set(c,off); off+=c.length; }
    const pcm=new Int16Array(len);
    for(let i=0;i<len;i++){ let s=Math.max(-1,Math.min(1,f32[i])); pcm[i]=s<0?s*0x8000:s*0x7fff; }
    return {pcm:pcm.buffer, sampleRate:this.sampleRate};
  }
}

async function sendPCM(buf,sr,lang){
  const r=await fetch(`${API}/api/asr/record?sample_rate=${sr}&language=${lang}`,{
    method:"POST", headers:{"Content-Type":"application/octet-stream"}, body:buf
  });
  if(!r.ok) throw new Error("识别请求失败");
  return await r.json();
}

// ---------- 语音识别页 ----------
let rec=new Recorder(), recTimer=null, recSeconds=0;
const waveBars=[]; const waveEl=$("#wave");
for(let i=0;i<24;i++){ const s=document.createElement("span"); waveEl.appendChild(s); waveBars.push(s); }

$("#recBtn").onclick=async()=>{
  const btn=$("#recBtn");
  if(!rec.recording){
    try{
      await rec.start(level=>{
        const h=Math.min(38,6+level*260);
        waveBars.forEach((b,i)=>{ b.style.height=(h*(0.5+Math.random()*0.7)).toFixed(0)+"px"; });
      });
      btn.textContent="停止录音"; btn.classList.add("recording");
      $("#recHint").textContent="正在录音...";
      recSeconds=0; $("#recTimer").textContent="00:00";
      recTimer=setInterval(()=>{ recSeconds++; const m=String(Math.floor(recSeconds/60)).padStart(2,"0"),s=String(recSeconds%60).padStart(2,"0"); $("#recTimer").textContent=`${m}:${s}`; },1000);
    }catch(e){ toast("无法访问麦克风: "+e.message); }
  }else{
    clearInterval(recTimer);
    const {pcm,sampleRate}=rec.stop();
    btn.textContent="开始录音"; btn.classList.remove("recording");
    waveBars.forEach(b=>b.style.height="6px");
    $("#recHint").innerHTML='<span class="spinner"></span> 识别中...';
    try{
      const res=await sendPCM(pcm,sampleRate,$("#langSel").value);
      $("#recHint").textContent="点击开始录音，再次点击结束并识别";
      showLatest(res);
    }catch(e){ $("#recHint").textContent="识别失败: "+e.message; }
  }
};

function showLatest(res){
  if(!res.text){ $("#latestResult").innerHTML='<div class="empty">未识别到语音内容</div>'; return; }
  $("#latestResult").innerHTML=`<div class="rec-item">
    <div class="content">
      <div class="text">${escapeHtml(res.text)}</div>
      <div class="meta">
        ${res.language?`<span class="chip lang">${res.language}</span>`:""}
        ${res.emotion?`<span class="chip emo">${res.emotion}</span>`:""}
        <span>${res.duration}s</span>
        <span style="color:var(--green)">✓ 已保存到记录</span>
      </div>
    </div>
    <button class="icon-btn" onclick="copyText('${escapeAttr(res.text)}')" style="color:var(--accent)">📋</button>
  </div>`;
}

// 上传
$("#uploadZone").onclick=()=>$("#fileInput").click();
$("#fileInput").onchange=async e=>{
  const f=e.target.files[0]; if(!f)return;
  $("#recHint").innerHTML='<span class="spinner"></span> 上传识别中...';
  const fd=new FormData(); fd.append("file",f); fd.append("language",$("#langSel").value);
  try{
    const r=await fetch(`${API}/api/asr/upload`,{method:"POST",body:fd});
    if(!r.ok) throw new Error((await r.json()).detail||"识别失败");
    const res=await r.json();
    $("#recHint").textContent="点击开始录音，再次点击结束并识别";
    showLatest(res);
  }catch(err){ $("#recHint").textContent="识别失败: "+err.message; }
  e.target.value="";
};

// ---------- 识别记录页 ----------
async function loadHistory(){
  const r=await fetch(`${API}/api/transcripts`); const list=await r.json();
  $("#histCount").textContent=`共 ${list.length} 条记录`;
  if(!list.length){ $("#histList").innerHTML='<div class="empty">暂无识别记录</div>'; return; }
  $("#histList").innerHTML=list.map(it=>`<div class="rec-item">
    <div class="content">
      <div class="text">${escapeHtml(it.text)}</div>
      <div class="meta">
        ${it.language?`<span class="chip lang">${it.language}</span>`:""}
        ${it.emotion?`<span class="chip emo">${it.emotion}</span>`:""}
        <span>${it.duration}s</span>
        <span>${it.source==="record"?"🎙 录音":"📁 上传"}</span>
        <span>${fmtTime(it.created_at)}</span>
      </div>
    </div>
    <button class="icon-btn" onclick="copyText('${escapeAttr(it.text)}')" style="color:var(--accent)">📋</button>
    <button class="icon-btn" onclick="delHist(${it.id})">🗑</button>
  </div>`).join("");
}
async function delHist(id){ await fetch(`${API}/api/transcripts/${id}`,{method:"DELETE"}); loadHistory(); }
$("#clearBtn").onclick=async()=>{ if(confirm("确认清空全部识别记录?")){ await fetch(`${API}/api/transcripts`,{method:"DELETE"}); loadHistory(); } };
$("#exportBtn").onclick=async()=>{
  const r=await fetch(`${API}/api/transcripts`); const list=await r.json();
  const txt=list.map(it=>`[${fmtTime(it.created_at)}] (${it.language||"?"}) ${it.text}`).join("\n");
  const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="识别记录.txt"; a.click();
};

// ---------- 对话页: 模型下拉 (来自已配置 providers) ----------
let chatProviders=[];
async function loadModels(force){
  if($("#modelSel").dataset.loaded && !force) return;
  try{
    const r=await fetch(`${API}/api/providers`); chatProviders=await r.json();
    const sel=$("#modelSel"); sel.innerHTML="";
    for(const p of chatProviders){
      // 每个 provider 拉取其模型列表; 失败则用其默认 model 或占位
      let models=[];
      try{ const mr=await fetch(`${API}/api/providers/${p.id}/models`); if(mr.ok) models=(await mr.json()).models||[]; }catch(e){}
      if(!models.length && p.model) models=[p.model];
      const og=document.createElement("optgroup"); og.label=p.name;
      for(const m of models){
        const o=document.createElement("option");
        o.value=`${p.id}|${m}`; o.textContent=m;
        if(p.is_default && (m===p.model||!p.model)) o.selected=true;
        og.appendChild(o);
      }
      if(models.length) sel.appendChild(og);
    }
    if(!sel.options.length){ sel.innerHTML='<option value="">请先在模型管理中配置</option>'; }
    sel.dataset.loaded="1";
  }catch(e){}
}

// ---------- 模型管理 ----------
let editingProviderId=null;
async function loadProviders(){
  const r=await fetch(`${API}/api/providers`); const list=await r.json();
  const box=$("#providerList");
  if(!list.length){ box.innerHTML='<div class="empty">暂无配置，点击上方按钮添加模型</div>'; return; }
  box.innerHTML=list.map(p=>`<div class="provider-card ${p.is_default?'is-default':''}">
    <div class="provider-info">
      <div class="pn">
        ${escapeHtml(p.name)}
        ${p.is_default?'<span class="badge default">默认</span>':''}
        <span class="badge kind">${p.kind==='ollama'?'本地':'在线'}</span>
      </div>
      <div class="pmeta">${escapeHtml(p.base_url)} ${p.model?' · '+escapeHtml(p.model):''} ${p.has_key?' · [已配置 API Key]':' · [无 Key]'}</div>
    </div>
    <div class="provider-acts">
      ${!p.is_default?`<button class="mini-btn" onclick="setDefault(${p.id})">设为默认</button>`:''}
      <button class="mini-btn" onclick="editProvider(${p.id})">编辑</button>
      <button class="mini-btn danger" onclick="delProvider(${p.id})">删除</button>
    </div>
  </div>`).join("");
}
async function setDefault(id){ await fetch(`${API}/api/providers/${id}/default`,{method:"POST"}); loadProviders(); loadModels(true); }
async function delProvider(id){ if(!confirm("确认删除该模型配置?"))return; await fetch(`${API}/api/providers/${id}`,{method:"DELETE"}); loadProviders(); loadModels(true); }
function openModal(p){ editingProviderId=p; $("#pmMsg").textContent=""; $("#pmKind").value=p?p.kind:"openai"; toggleKeyFld(); $("#pmName").value=p?p.name:""; $("#pmUrl").value=p?p.base_url:""; $("#pmKey").value=""; $("#pmModel").value=p?p.model||"":""; $("#pmModelList").innerHTML=""; $("#pmModelList").style.display="none"; $("#pmTitle").textContent=p?"编辑模型":"添加模型"; $("#providerModal").classList.add("show"); }
function editProvider(id){ fetch(`${API}/api/providers/${id}`).then(r=>r.json()).then(p=>{ p.id=id; delete p.has_key; openModal(p); }); }
$("#addProviderBtn").onclick=()=>openModal(null);
$("#pmCancel").onclick=()=>{ $("#providerModal").classList.remove("show"); };
$("#pmKind").onchange=toggleKeyFld;
function toggleKeyFld(){ $("#pmKeyFld").style.display=$("#pmKind").value==="ollama"?"none":"flex"; }
$("#pmFetchModels").onclick=async()=>{
  const kind=$("#pmKind").value, url=$("#pmUrl").value.trim(), key=$("#pmKey").value;
  if(!url) return toast("请先填写接口地址");
  const msg=$("#pmMsg"); msg.className="pm-msg"; msg.textContent="拉取模型列表中...";
  try{
    // 通过后端拉取 (避免浏览器 CORS): 临时用 test 校验连通, 再走后端 models 探测
    const r=await fetch(`${API}/api/providers/models_probe`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,base_url:url,api_key:key})});
    const d=await r.json();
    if(!d.ok){ msg.className="pm-msg err"; msg.textContent=d.message||"拉取失败"; return; }
    const sl=$("#pmModelList");
    if(d.models&&d.models.length){
      sl.innerHTML=d.models.map(m=>`<option value="${m}">${m}</option>`).join("");
      sl.style.display="block";
      sl.onchange=()=>{ $("#pmModel").value=sl.value; };
      if(!$("#pmModel").value) $("#pmModel").value=d.models[0];
      msg.className="pm-msg ok"; msg.textContent=`拉取到 ${d.models.length} 个模型，可在下方选择`;
    }else{
      msg.className="pm-msg ok"; msg.textContent="连接成功，但未返回模型列表，请手动填写";
    }
  }catch(e){ msg.className="pm-msg err"; msg.textContent="拉取失败: "+e.message; }
};
$("#pmTest").onclick=async()=>{
  const kind=$("#pmKind").value, url=$("#pmUrl").value.trim(), key=$("#pmKey").value;
  if(!url) return toast("请填写接口地址");
  const msg=$("#pmMsg"); msg.className="pm-msg"; msg.textContent="测试中...";
  try{
    const r=await fetch(`${API}/api/providers/test`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kind,base_url:url,api_key:key})});
    const d=await r.json(); msg.className="pm-msg "+(d.ok?"ok":"err"); msg.textContent=d.message;
  }catch(e){msg.className="pm-msg err"; msg.textContent="请求失败: "+e.message;}
};
$("#pmSave").onclick=async()=>{
  const name=$("#pmName").value.trim(), kind=$("#pmKind").value, url=$("#pmUrl").value.trim(), key=$("#pmKey").value, model=$("#pmModel").value.trim();
  if(!name||!url) return toast("名称和地址不能为空");
  const body={name,kind,base_url:url,api_key:key,model,is_default:!chatProviders.length||$("#providerList").querySelector(".provider-card.is-default")?undefined:1};
  try{
    if(editingProviderId){
      await fetch(`${API}/api/providers/${editingProviderId}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    }else{
      const r=await fetch(`${API}/api/providers`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json(); editingProviderId=d.id;
    }
    $("#providerModal").classList.remove("show"); loadProviders(); loadModels(true); toast("已保存");
  }catch(e){toast("保存失败: "+e.message);}
};
let currentAudio=null;
async function loadVoices(){
  if($("#voiceSel").dataset.loaded)return;
  try{
    const r=await fetch(`${API}/api/tts/voices`); const {voices}=await r.json();
    $("#voiceSel").innerHTML=voices.map(v=>`<option value="${v.id}">${v.name}</option>`).join("");
    $("#voiceSel").dataset.loaded="1";
  }catch(e){}
}
function stopSpeak(){ if(currentAudio){ currentAudio.pause(); currentAudio=null; } }
async function speak(text,btn){
  stopSpeak();
  const clean=(text||"").replace(/<think>[\s\S]*?<\/think>/g,"").trim();
  if(!clean) return;
  if(btn){ btn.textContent="⏳"; }
  try{
    const r=await fetch(`${API}/api/tts`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:clean,voice:$("#voiceSel").value||"zf_xiaoxiao"})
    });
    if(!r.ok) throw new Error("合成失败");
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    currentAudio=new Audio(url);
    if(btn){ btn.textContent="🔊"; }
    currentAudio.onended=()=>{ URL.revokeObjectURL(url); currentAudio=null; };
    await currentAudio.play();
  }catch(e){ if(btn)btn.textContent="🔊"; toast("朗读失败: "+e.message); }
}

async function loadConversations(){
  const r=await fetch(`${API}/api/conversations`); const list=await r.json();
  $("#convItems").innerHTML=list.map(c=>`<div class="conv-item ${c.id===currentConv?"active":""}" data-id="${c.id}">
    <span class="t" onclick="openConv(${c.id})">${escapeHtml(c.title)}</span>
    <button class="icon-btn" onclick="delConv(${c.id})" style="padding:2px">✕</button>
  </div>`).join("")||'<div class="empty" style="padding:20px;font-size:12px">暂无对话</div>';
}
async function openConv(id){
  currentConv=id; loadConversations();
  const r=await fetch(`${API}/api/conversations/${id}/messages`); const msgs=await r.json();
  renderMsgs(msgs);
}
function renderMsgs(msgs){
  const box=$("#msgs");
  if(!msgs.length){ box.innerHTML='<div class="empty">开始对话吧 👋</div>'; return; }
  box.innerHTML=msgs.map(m=>renderMsg(m.role,m.content)).join("");
  box.scrollTop=box.scrollHeight;
}
function renderMsg(role,content){
  if(role==="user") return `<div class="msg user">${escapeHtml(content)}</div>`;
  // 拆分 <think>
  let think="",text=content;
  const tm=content.match(/<think>([\s\S]*?)<\/think>/);
  if(tm){ think=tm[1].trim(); text=content.replace(/<think>[\s\S]*?<\/think>/,"").trim(); }
  return `<div class="msg assistant">
    ${think?`<div class="think-toggle" onclick="this.nextElementSibling.classList.toggle('show')">💭 显示思考过程</div><div class="think">${escapeHtml(think)}</div>`:""}
    <div class="body">${escapeHtml(text)}</div>
    ${text?`<button class="speak-btn" onclick="speak(this.previousElementSibling.textContent,this)" title="朗读">🔊</button>`:""}
  </div>`;
}
async function delConv(id){ event.stopPropagation(); await fetch(`${API}/api/conversations/${id}`,{method:"DELETE"}); if(currentConv===id){currentConv=null; $("#msgs").innerHTML='<div class="empty">开始对话吧 👋</div>';} loadConversations(); }
$("#newConvBtn").onclick=()=>{ currentConv=null; $("#msgs").innerHTML='<div class="empty">开始一段新对话吧 👋</div>'; loadConversations(); };

async function sendMessage(){
  const inp=$("#chatInput"); const msg=inp.value.trim(); if(!msg)return;
  inp.value=""; inp.style.height="44px";
  const box=$("#msgs");
  if(box.querySelector(".empty"))box.innerHTML="";
  box.insertAdjacentHTML("beforeend",renderMsg("user",msg));
  const aid="a"+Date.now();
  box.insertAdjacentHTML("beforeend",`<div class="msg assistant" id="${aid}"><span class="spinner"></span></div>`);
  box.scrollTop=box.scrollHeight;
  try{
    const r=await fetch(`${API}/api/chat/stream`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({conversation_id:currentConv,message:msg,...parseModelSel()})
    });
    const reader=r.body.getReader(); const dec=new TextDecoder();
    let full="",buf="";
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n\n"); buf=lines.pop();
      for(const l of lines){
        if(!l.startsWith("data:"))continue;
        const d=JSON.parse(l.slice(5).trim());
        if(d.conversation_id&&!currentConv){ currentConv=d.conversation_id; loadConversations(); }
        full+=d.text;
        $("#"+aid).outerHTML=renderMsg("assistant",full).replace('class="msg assistant"',`class="msg assistant" id="${aid}"`);
        box.scrollTop=box.scrollHeight;
      }
    }
    loadConversations();
    // 自动朗读 AI 回复
    if($("#autoPlayChk").checked && full.trim()){ speak(full); }
  }catch(e){ $("#"+aid).innerHTML="出错: "+e.message; }
}
$("#sendBtn").onclick=sendMessage;
$("#chatInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
$("#chatInput").addEventListener("input",function(){ this.style.height="44px"; this.style.height=Math.min(140,this.scrollHeight)+"px"; });

// 对话语音输入
let chatRec=new Recorder();
$("#chatMic").onclick=async()=>{
  const btn=$("#chatMic");
  if(!chatRec.recording){
    try{ await chatRec.start(); btn.classList.add("recording"); btn.textContent="⏹"; toast("录音中，再次点击结束"); }
    catch(e){ toast("无法访问麦克风"); }
  }else{
    const {pcm,sampleRate}=chatRec.stop();
    btn.classList.remove("recording"); btn.textContent="🎙️";
    toast("识别中...");
    try{
      const res=await sendPCM(pcm,sampleRate,$("#langSel").value);
      if(res.text){ const inp=$("#chatInput"); inp.value+=(inp.value?" ":"")+res.text; inp.focus(); toast("已转文字"); }
      else toast("未识别到内容");
    }catch(e){ toast("识别失败"); }
  }
};

// ---------- 工具 ----------
function parseModelSel(){
  const v=$("#modelSel").value||"";
  const i=v.indexOf("|");
  if(i<0) return {};
  return {provider_id:parseInt(v.slice(0,i)), model:v.slice(i+1)};
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return (s||"").replace(/'/g,"\\'").replace(/\n/g," "); }
function copyText(t){ navigator.clipboard.writeText(t).then(()=>toast("已复制")); }

// ---------- 模型加载状态轮询 ----------
const STATUS_TXT={loading:"加载中…",ready:"就绪",error:"失败"};
let statusTimer=null;
async function pollStatus(){
  try{
    const r=await fetch(`${API}/api/status`); const s=await r.json();
    let allDone=true;
    for(const k of ["asr","llm","tts"]){
      const dot=$("#dot-"+k), txt=$("#txt-"+k);
      dot.className="status-dot "+s[k];
      if(k==="llm" && s[k]==="ready" && s.llm_msg){ txt.textContent=s.llm_msg; }
      else{ txt.textContent=STATUS_TXT[s[k]]||s[k]; }
      if(s[k]==="error" && (s[k+"_msg"])){ txt.title=s[k+"_msg"]; }
      if(s[k]==="loading") allDone=false;
    }
    if(allDone){ clearInterval(statusTimer); statusTimer=null; }
  }catch(e){}
}
pollStatus();
statusTimer=setInterval(pollStatus,1500);
// 界面已加载 -> 触发后台加载模型 (幂等; 与 GUI 的 loaded 事件互为兜底)
fetch(`${API}/api/engines/start`,{method:"POST"}).catch(()=>{});
</script>
